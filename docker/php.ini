; Ajustes de PHP para el servidor publicado.
; El tope real de las fotos lo pone la aplicación (5 MB en includes/imagenes.php);
; aquí se deja un poco más de aire para que el aviso lo dé el programa y no PHP.
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M
max_execution_time = 60

; En producción los errores se registran, no se le enseñan al cliente.
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off
date.timezone = America/Mexico_City
